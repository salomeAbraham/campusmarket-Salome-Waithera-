<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
         <div class="container">
            <h1>CampusMarket</h1>
            <p>Your campus marketplace</p>

        <nav>
            <ul>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            </ul>
        </nav>
         </div>
    </header>

    <main class="form-container">

        <div class="form-card">

            <h2>Create an Account</h2>
            <p class="form-subtitle">
                Join CampusMarket and start shopping with ease.
            </p>

            <!-- Success/Error Message -->
            <div id="form-message"></div>

            <form id="register-form">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter your full name"
                    >
                    <small class="error" id="name-error"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="text" 
                        id="email" 
                        placeholder="Enter your email"
                    >
                    <small class="error" id="email-error"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-container">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                        >

                        <button 
                            type="button" 
                            id="toggle-password"
                        >
                            Show
                        </button>
                    </div>

                    <small class="error" id="password-error"></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <div class="password-container">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            placeholder="Confirm your password"
                        >

                        <button 
                            type="button" 
                            id="toggle-confirm-password"
                        >
                            Show
                        </button>
                    </div>

                    <small class="error" id="confirm-password-error"></small>
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

        </div>

    </main>

    <script src="register.js"></script>

</body>
</html>
