<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusMarket - Register</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <header>

        <div class="container">

            <div class="logo-area">

                <h1>CampusMarket</h1>

                <p>Your campus marketplace</p>

            </div>

            <nav>

                <ul>

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="catalog.html">
                            Catalogue
                        </a>
                    </li>

                    <li>
                        <a href="register.html">
                            Register
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>

        <section class="registration-section">

            <div class="container">

                <div class="registration-card">

                    <h2>
                        Create Your CampusMarket Account
                    </h2>

                    <p class="form-intro">
                        Register to start using CampusMarket.
                    </p>


                    <form
                        id="registrationForm"
                        novalidate
                    >

                        <div class="form-group">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full name"
                            >

                            <small
                                id="fullNameError"
                                class="error-message"
                            ></small>

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="text"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                            >

                            <small
                                id="emailError"
                                class="error-message"
                            ></small>

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="At least 8 characters"
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="password-toggle"
                                >
                                    Show
                                </button>

                            </div>

                            <small
                                id="passwordError"
                                class="error-message"
                            ></small>

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Enter your password again"
                                >

                                <button
                                    type="button"
                                    id="toggleConfirmPassword"
                                    class="password-toggle"
                                >
                                    Show
                                </button>

                            </div>

                            <small
                                id="confirmPasswordError"
                                class="error-message"
                            ></small>

                        </div>


                        <button
                            type="submit"
                            class="register-button"
                        >
                            Create Account
                        </button>


                        <div
                            id="successMessage"
                            class="success-message"
                        ></div>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <div class="container">

            <p>
                &copy; 2026 CampusMarket.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="app.js"></script>

</body>

</html>
